# Сборка APK (debug, для тестов) — артефакт app-debug.apk скачивается из раздела Actions
name: android
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Установка NDK и CMake
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.1.10909125"
      - name: Исходники SDL2
        run: git clone --depth 1 --branch release-2.30.x https://github.com/libsdl-org/SDL.git android/app/src/main/cpp/SDL
      - name: Данные и шрифты в APK
        run: |
          mkdir -p android/app/src/main/assets
          cp -r data android/app/src/main/assets/data
          cp -r assets android/app/src/main/assets/assets
      - name: Сборка APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tribes-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

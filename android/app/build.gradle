apply plugin: 'com.android.application'

android {
    namespace 'org.libsdl.app'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'ru.tribes.remake'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1-prototype'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }   // arm64 — железо R36S/телефонов, x86_64 — эмулятор
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_shared'; cppFlags '-std=c++17' }
        }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
    sourceSets {
        main { assets.srcDirs = ['src/main/assets'] }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false }
}
